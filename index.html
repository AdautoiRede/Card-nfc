<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081322">
  <meta name="description" content="Cartão de visita digital de Adauto Aquino — I-REDE.">
  <title>Adauto Aquino | Cartão Digital</title>
  <style>
    :root { color-scheme: dark; --bg:#081322; --surface:#111f31; --border:#2b3d52; --text:#f5f8ff; --muted:#b3c3d4; --accent:#40c6ed; --accent2:#857aff; }
    * { box-sizing: border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; min-height:100dvh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(ellipse at 15% 10%,#183653 0,transparent 45%),radial-gradient(ellipse at 90% 90%,#25204b 0,transparent 40%),var(--bg); display:grid; place-items:center; padding:32px 16px; }
    .shell { width:min(100%,450px); }
    .card { position:relative; overflow:hidden; padding:34px 26px 26px; border:1px solid var(--border); border-radius:28px; background:linear-gradient(150deg,rgba(25,43,66,.97),rgba(11,24,40,.97)); box-shadow:0 28px 70px rgba(0,0,0,.38); }
    .card::before { content:""; position:absolute; width:230px; height:230px; border-radius:50%; background:rgba(64,198,237,.12); filter:blur(55px); right:-100px; top:-120px; pointer-events:none; }
    .topline { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:27px; }
    .brand { font-weight:850; letter-spacing:.12em; font-size:14px; }
    .tag { font-size:10px; font-weight:750; letter-spacing:.12em; padding:7px 10px; border-radius:999px; border:1px solid rgba(64,198,237,.36); color:#8be1f9; background:rgba(64,198,237,.08); }
    .avatar { display:grid; place-items:center; height:82px; width:82px; background:linear-gradient(135deg,#289ac8,#6b65c5); border:3px solid rgba(255,255,255,.16); border-radius:24px; font-weight:800; font-size:28px; letter-spacing:-.05em; margin-bottom:21px; }
    h1 { font-size:clamp(26px,7vw,33px); line-height:1.14; letter-spacing:-.04em; margin:0 0 9px; }
    .role { color:#dce8f4; font-weight:600; font-size:16px; margin:0 0 7px; }
    .org { color:var(--accent); font-size:14px; font-weight:750; margin:0; }
    .line { height:1px; background:var(--border); margin:27px 0 22px; }
    .links { display:grid; gap:11px; }
    .contact { display:flex; align-items:center; gap:13px; width:100%; min-height:61px; padding:12px 14px; border:1px solid var(--border); border-radius:15px; background:rgba(255,255,255,.035); color:var(--text); text-decoration:none; transition:background .16s,border-color .16s,transform .16s; }
    .contact:hover, .contact:focus-visible { background:rgba(64,198,237,.09); border-color:rgba(64,198,237,.6); transform:translateY(-1px); }
    .icon { flex:none; width:38px; height:38px; display:grid; place-items:center; border-radius:11px; background:rgba(64,198,237,.11); color:#78dcf7; }
    .icon svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .contact-text { min-width:0; flex:1; }
    .contact-label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
    .contact-value { display:block; overflow-wrap:anywhere; font-size:13px; font-weight:600; }
    .arrow { flex:none; font-size:18px; color:var(--muted); }
    .save { margin-top:23px; width:100%; border:0; min-height:57px; border-radius:15px; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:10px; background:linear-gradient(110deg,#26b9df,#7086ff); color:#071424; font-size:15px; font-weight:800; font-family:inherit; box-shadow:0 10px 26px rgba(48,168,219,.18); transition:filter .16s,transform .16s; }
    .save:hover,.save:focus-visible {filter:brightness(1.1); transform:translateY(-1px);}
    .save:active {transform:translateY(0);}
    .small { text-align:center; color:var(--muted); font-size:11px; line-height:1.5; margin:13px 0 0; }
    footer { color:#91a6bb; text-align:center; margin-top:17px; font-size:11px; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    @media (max-width:380px) { .card {padding:26px 18px 22px;} .contact {padding:10px;} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after {transition:none!important;scroll-behavior:auto!important;} }
  </style>
</head>
<body>
  <main class="shell">
    <article class="card" aria-label="Cartão de visita digital">
      <div class="topline"><span class="brand">I-REDE</span><span class="tag">CARTÃO DIGITAL</span></div>
      <div class="avatar" aria-hidden="true">AA</div>
      <h1>Adauto Aquino</h1>
      <p class="org">I-REDE</p>
      <div class="line" aria-hidden="true"></div>
      <nav class="links" aria-label="Meios de contato">
        <a class="contact" href="mailto:adauto.aquino@irede.org.br" aria-label="Enviar e-mail para adauto.aquino@irede.org.br">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
          <span class="contact-text"><span class="contact-label">E-mail</span><span class="contact-value">adauto.aquino@irede.org.br</span></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="contact" href="https://wa.me/5585985653037" target="_blank" rel="noopener noreferrer" aria-label="Conversar pelo WhatsApp">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.5 11.6a8.5 8.5 0 0 1-12.4 7.5L3.5 20.5l1.4-4.5a8.5 8.5 0 1 1 15.6-4.4Z"/><path d="M8.7 8.2c.2-.3.4-.3.6-.3h.5c.2 0 .4.1.5.4l.8 1.7c.1.2 0 .5-.2.7l-.6.6c.7 1.3 1.7 2.2 3 2.8l.6-.7c.2-.2.5-.3.7-.2l1.7.8c.3.1.4.3.4.5v.5c0 .3-.1.5-.3.7-.5.5-1.3.7-2.1.5-3.3-.8-6-3.4-6.8-6.8-.2-.8 0-1.6.5-2.1Z"/></svg></span>
          <span class="contact-text"><span class="contact-label">WhatsApp</span><span class="contact-value">+55 (85) 98565-3037</span></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="contact" href="https://www.linkedin.com/in/adauto-aquino-a35422255/" target="_blank" rel="noopener noreferrer" aria-label="Abrir perfil no LinkedIn">
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.1M12 17v-7h0v1.1a3 3 0 0 1 5 2.1V17"/></svg></span>
          <span class="contact-text"><span class="contact-label">LinkedIn</span><span class="contact-value">Ver perfil profissional</span></span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <button class="save" id="saveContact" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M5 17v3h14v-3"/></svg>
        Salvar contato
      </button>
      <p class="small">Baixe o contato para adicionar à agenda do celular.</p>
    </article>
    <footer>Conecte-se • Compartilhe • Mantenha contato</footer>
  </main>
  <script>
    document.getElementById('saveContact').addEventListener('click', () => {
      // vCard 3.0: compatível com a importação de contatos em Android e iOS.
      const card = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:Aquino;Adauto;;;',
        'FN:Adauto Aquino',
        'ORG:I-REDE',
        'EMAIL;TYPE=INTERNET,WORK:adauto.aquino@irede.org.br',
        'TEL;TYPE=CELL:+5585985653037',
        'URL:https://www.linkedin.com/in/adauto-aquino-a35422255/',
        'END:VCARD'
      ].join('\r\n') + '\r\n';
      const blob = new Blob([card], {type: 'text/vcard;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Adauto_Aquino.vcf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
